openapi: 3.0.3
info:
  title: 会計アプリケーションAPI
  version: 1.0.0
servers:
  - url: /api
paths:
  /accounts:
    get:
      summary: 勘定科目一覧を取得する
      parameters:
        - in: query
          name: category
          schema:
            $ref: '#/components/schemas/AccountCategory'
      responses:
        '200':
          description: 勘定科目一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountListItem'
    post:
      summary: 勘定科目を登録する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '201':
          description: 登録した勘定科目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      summary: 勘定科目と補助科目一覧を取得する
      responses:
        '200':
          description: 勘定科目詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: 勘定科目を変更する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '200':
          description: 変更した勘定科目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /accounts/{accountId}/subaccounts:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      summary: 補助科目を登録する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubaccountInput'
      responses:
        '201':
          description: 登録した補助科目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subaccount'
        '404':
          $ref: '#/components/responses/NotFound'
  /accounts/{accountId}/subaccounts/{subaccountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: subaccountId
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: 補助科目を変更する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubaccountInput'
      responses:
        '200':
          description: 変更した補助科目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subaccount'
        '404':
          $ref: '#/components/responses/NotFound'
  /fixed-assets:
    get:
      summary: 固定資産一覧を取得する
      responses:
        '200':
          description: 固定資産一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FixedAsset'
    post:
      summary: 固定資産を登録する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedAssetInput'
      responses:
        '201':
          description: 登録した固定資産
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
  /fixed-assets/journal-options:
    get:
      summary: 固定資産勘定で選択する固定資産候補を取得する
      responses:
        '200':
          description: 固定資産IDと表示名の候補一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FixedAssetOption'
  /fixed-assets/{fixedAssetId}:
    parameters:
      - $ref: '#/components/parameters/FixedAssetId'
    get:
      summary: 固定資産詳細を取得する
      responses:
        '200':
          description: 固定資産詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedAsset'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: 固定資産を変更する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedAssetInput'
      responses:
        '200':
          description: 変更した固定資産
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /journals:
    get:
      summary: 指定月の仕訳一覧を取得する
      parameters:
        - in: query
          name: month
          required: true
          description: 対象年月（YYYY-MM）
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: 指定月の仕訳一覧（取引日降順）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Journal'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: 貸借一致を検証して仕訳を登録する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalInput'
      responses:
        '201':
          description: 登録した仕訳
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journal'
        '400':
          $ref: '#/components/responses/BadRequest'
  /journals/{journalId}:
    parameters:
      - $ref: '#/components/parameters/JournalId'
    get:
      summary: 編集対象の仕訳を取得する
      responses:
        '200':
          description: 仕訳と仕訳明細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journal'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: 仕訳を変更する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalInput'
      responses:
        '200':
          description: 変更した仕訳
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: 仕訳と明細を物理削除する
      responses:
        '204':
          description: 仕訳と仕訳明細を削除した。復元不可。
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/balance-sheet:
    get:
      summary: 貸借対照表を取得する
      parameters:
        - in: query
          name: asOf
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 指定日時点の貸借対照表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSheet'
  /reports/income-statement:
    get:
      summary: 損益計算書を取得する
      parameters:
        - in: query
          name: start
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: end
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 指定期間の損益計算書
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeStatement'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: integer
    JournalId:
      name: journalId
      in: path
      required: true
      schema:
        type: integer
    FixedAssetId:
      name: fixedAssetId
      in: path
      required: true
      schema:
        type: integer
  responses:
    BadRequest:
      description: 入力値が不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 対象データが存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AccountCategory:
      type: string
      enum: [asset, liability, equity, profit, loss]
    AccountInput:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/AccountCategory'
    AccountListItem:
      allOf:
        - $ref: '#/components/schemas/AccountInput'
        - type: object
          required: [id, subaccountCount, systemKey, isSystem]
          properties:
            id:
              type: integer
            subaccountCount:
              type: integer
            systemKey:
              type: string
              nullable: true
              enum: [fixed_asset, depreciation_expense]
              description: 固定資産勘定または減価償却費勘定の専用ID。通常勘定ではnull。
            isSystem:
              type: boolean
              description: システム初期勘定科目で、削除不可であることを示す。
    Account:
      allOf:
        - $ref: '#/components/schemas/AccountListItem'
        - type: object
          required: [subaccounts]
          properties:
            subaccounts:
              type: array
              items:
                $ref: '#/components/schemas/Subaccount'
    SubaccountInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    Subaccount:
      allOf:
        - $ref: '#/components/schemas/SubaccountInput'
        - type: object
          required: [id, accountId]
          properties:
            id:
              type: integer
            accountId:
              type: integer
    FixedAssetInput:
      type: object
      description: 必須条件と値域はOPEN-DOM-009～011の確定後に設定する。
      properties:
        name:
          type: string
        acquisitionDate:
          type: string
          format: date
        acquisitionPrice:
          type: number
          description: 通貨、精度、税・付随費用の扱いはOPEN-DOM-010を参照。
        depreciationMethod:
          type: string
          description: 選択肢と適用条件はOPEN-DOM-011で定義する。
        usefulLife:
          type: number
          description: 単位・精度・値域はOPEN-DOM-011で定義する。
        residualValue:
          type: number
          description: 通貨、精度、値域はOPEN-DOM-010～011を参照。
        depreciationStartDate:
          type: string
          format: date
    FixedAsset:
      allOf:
        - $ref: '#/components/schemas/FixedAssetInput'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
    FixedAssetOption:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          description: 固定資産勘定の仕訳明細ではsubaccountIdとして使用する。
        name:
          type: string
    JournalLineInput:
      type: object
      required: [accountId, side, amount]
      properties:
        accountId:
          type: integer
        subaccountId:
          type: integer
          description: 通常勘定科目では当該勘定の補助科目ID、固定資産勘定では固定資産ID。解釈はaccountIdのsystemKeyによる。
        side:
          type: string
          enum: [debit, credit]
        amount:
          type: integer
          minimum: 1
    JournalInput:
      type: object
      required: [date, description, lines]
      properties:
        date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
        lines:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/JournalLineInput'
    Journal:
      allOf:
        - $ref: '#/components/schemas/JournalInput'
        - type: object
          required: [id, debitTotal, creditTotal]
          properties:
            id:
              type: integer
            debitTotal:
              type: integer
            creditTotal:
              type: integer
    StatementLine:
      type: object
      required: [accountId, accountName, amount]
      properties:
        accountId:
          type: integer
        accountName:
          type: string
        amount:
          type: integer
    BalanceSheet:
      type: object
      required: [asOf, assets, liabilities, equity, totals]
      properties:
        asOf:
          type: string
          format: date
        assets:
          type: array
          items:
            $ref: '#/components/schemas/StatementLine'
        liabilities:
          type: array
          items:
            $ref: '#/components/schemas/StatementLine'
        equity:
          type: array
          items:
            $ref: '#/components/schemas/StatementLine'
        totals:
          type: object
          required: [assets, liabilities, equity]
          properties:
            assets:
              type: integer
            liabilities:
              type: integer
            equity:
              type: integer
    IncomeStatement:
      type: object
      required: [start, end, revenues, expenses, totals]
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        revenues:
          type: array
          items:
            $ref: '#/components/schemas/StatementLine'
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/StatementLine'
        totals:
          type: object
          required: [revenues, expenses, netIncome]
          properties:
            revenues:
              type: integer
            expenses:
              type: integer
            netIncome:
              type: integer
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
