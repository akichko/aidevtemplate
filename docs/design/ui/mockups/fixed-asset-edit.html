<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>固定資産登録・編集 | 帳務</title>
  <link rel="stylesheet" href="mockup.css">
</head>
<body>
  <main class="mock-page">
    <div class="mock-page-inner">
      <div class="breadcrumb"><a href="fixed-asset-list.html">固定資産一覧へ戻る</a><span aria-hidden="true">/</span><strong>固定資産登録・編集</strong></div>
      <div class="page-heading">
        <div><p class="eyebrow">FIXED ASSETS</p><h1>固定資産を登録</h1><p class="subtitle">取得情報と減価償却関連設定を入力します。</p></div>
        <span class="panel-note">画面構成確認用モック</span>
      </div>

      <form class="panel master-form" id="fixed-asset-form">
        <div class="master-fields">
          <div class="field"><label for="asset-name">名称</label><input class="control" id="asset-name" type="text"></div>
          <div class="field"><label for="acquisition-date">取得日</label><input class="control" id="acquisition-date" type="date"></div>
          <div class="field"><label for="acquisition-price">取得価格</label><input class="control" id="acquisition-price" type="text" inputmode="decimal"></div>
          <div class="field"><label for="depreciation-method">償却方法</label><select class="control" id="depreciation-method"><option value="">償却方法を選択</option></select></div>
          <div class="field"><label for="useful-life">耐用年数</label><input class="control" id="useful-life" type="text" inputmode="decimal"></div>
          <div class="field"><label for="residual-value">残存価額</label><input class="control" id="residual-value" type="text" inputmode="decimal"></div>
          <div class="field"><label for="depreciation-start-date">償却開始日</label><input class="control" id="depreciation-start-date" type="date"></div>
        </div>
        <div class="form-footer">
          <a class="button secondary" href="fixed-asset-list.html">キャンセル</a>
          <button class="button" type="button">保存</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
